[project]
name = "agent-host"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "boto3>=1.34",
  "yfinance>=0.2.40",
  "curl_cffi>=0.7",
  "lxml>=5",              # yfinance get_earnings_dates() parses with lxml; absent => earnings silently []
  "holidays>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[dynamodb]>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]   # pyflakes、import 排序(暂不启用 E:测试里的分号习惯/长行是刻意风格,不做 lint-fight)

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true   # 渐进策略:先不因第三方缺 stub 报错
